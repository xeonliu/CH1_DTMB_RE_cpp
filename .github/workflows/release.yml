name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            artifact: lme2510_stream-linux-x64
          - name: macos
            os: macos-latest
            artifact: lme2510_stream-macos
          - name: windows-x64
            os: windows-latest
            artifact: lme2510_stream-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install libusb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Install libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb pkg-config

      - name: Install libusb (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libusb:x64-windows

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Stage artifact
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              cp build/Release/lme2510_stream.exe "${{ matrix.artifact }}"
              ;;
            macOS)
              cp build/lme2510_stream "${{ matrix.artifact }}"
              ;;
            Linux)
              cp build/lme2510_stream "${{ matrix.artifact }}"
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.artifact }}

  windows-xp:
    name: Windows XP (i686 MinGW)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain and native libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-mingw-w64-i686-posix \
            libusb-1.0-0-dev \
            pkg-config

      - name: Build host firmware generator
        run: |
          cmake -S . -B build/host-gen -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-gen --target gen_firmware_embed --parallel 2

      - name: Build libusb 1.0.23 (last XP-compatible release)
        env:
          XP_PREFIX: ${{ runner.temp }}/libusb-xp-prefix
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -o libusb-1.0.23.tar.bz2 \
            https://github.com/libusb/libusb/releases/download/v1.0.23/libusb-1.0.23.tar.bz2
          tar -xjf libusb-1.0.23.tar.bz2
          cd libusb-1.0.23
          ./configure --host=i686-w64-mingw32 \
            --prefix="$XP_PREFIX" \
            --enable-static \
            --disable-shared \
            --disable-udev \
            CFLAGS="-O2 -D_WIN32_WINNT=0x0501 -DWINVER=0x0501"
          make -C libusb -j"$(nproc)"
          make -C libusb install

      - name: Configure Windows XP build
        env:
          XP_PREFIX: ${{ runner.temp }}/libusb-xp-prefix
        run: |
          cmake -S . -B build/xp \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/mingw-i686-xp-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLME2510_HOST_GEN_FIRMWARE_EMBED="$GITHUB_WORKSPACE/build/host-gen/gen_firmware_embed" \
            -DLIBUSB_INCLUDE_DIR="$XP_PREFIX/include/libusb-1.0" \
            -DLIBUSB_LIBRARY="$XP_PREFIX/lib/libusb-1.0.a"

      - name: Build
        run: cmake --build build/xp --parallel 2

      - name: Stage XP artifact
        run: |
          cp build/xp/lme2510_stream.exe lme2510_stream-xp-x86.exe
          file lme2510_stream-xp-x86.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-xp-x86
          path: lme2510_stream-xp-x86.exe

  release:
    name: Publish GitHub Release
    needs: [native, windows-xp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum lme2510_stream-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
