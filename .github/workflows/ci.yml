name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install libusb (Linux)
        if: runner.os == 'Linux'
        # FTXUI is fetched automatically by CMake (FetchContent) when it is not
        # installed, so no system FTXUI package is needed here.
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Install libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb pkg-config ftxui

      - name: Install libusb (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # FTXUI is fetched automatically by CMake (FetchContent) below.
          vcpkg install libusb:x64-windows

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Smoke test (help)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/Release/lme2510_stream.exe --help
          else
            ./build/lme2510_stream --help
          fi

  # GitHub does not offer Windows XP hosted runners, so the XP artifact is
  # cross-compiled on Linux with an i686 MinGW-w64 toolchain.  libusb 1.0.24
  # dropped XP support, therefore this job pins libusb to 1.0.23.
  windows-xp:
    name: Windows XP (i686 MinGW)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain and native libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-mingw-w64-i686-posix \
            libusb-1.0-0-dev \
            pkg-config
          i686-w64-mingw32-g++ --version

      # The firmware-embedding generator must run on the build host, so build
      # a native copy first and hand it to the cross CMake configure.
      - name: Build host firmware generator
        run: |
          cmake -S . -B build/host-gen -DCMAKE_BUILD_TYPE=Release -DLME2510_ENABLE_TUI=OFF
          cmake --build build/host-gen --target gen_firmware_embed --parallel 2

      - name: Build libusb 1.0.23 (last XP-compatible release)
        env:
          XP_PREFIX: ${{ runner.temp }}/libusb-xp-prefix
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -o libusb-1.0.23.tar.bz2 \
            https://github.com/libusb/libusb/releases/download/v1.0.23/libusb-1.0.23.tar.bz2
          tar -xjf libusb-1.0.23.tar.bz2
          cd libusb-1.0.23
          ./configure --host=i686-w64-mingw32 \
            --prefix="$XP_PREFIX" \
            --enable-static \
            --disable-shared \
            --disable-udev \
            CFLAGS="-O2 -D_WIN32_WINNT=0x0501 -DWINVER=0x0501"
          make -C libusb -j"$(nproc)"
          make -C libusb install

      - name: Configure Windows XP build
        env:
          XP_PREFIX: ${{ runner.temp }}/libusb-xp-prefix
        run: |
          cmake -S . -B build/xp \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/mingw-i686-xp-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLME2510_HOST_GEN_FIRMWARE_EMBED="$GITHUB_WORKSPACE/build/host-gen/gen_firmware_embed" \
            -DLIBUSB_INCLUDE_DIR="$XP_PREFIX/include/libusb-1.0" \
            -DLIBUSB_LIBRARY="$XP_PREFIX/lib/libusb-1.0.a"

      - name: Build
        run: cmake --build build/xp --parallel 2

      - name: Verify and stage artifact
        run: |
          cp build/xp/lme2510_stream.exe lme2510_stream-xp-x86.exe
          file lme2510_stream-xp-x86.exe
          echo "--- imported DLLs ---"
          objdump -p lme2510_stream-xp-x86.exe | awk '/DLL Name/{print $3}'

      - name: Upload XP artifact
        uses: actions/upload-artifact@v4
        with:
          name: lme2510-stream-xp-x86
          path: lme2510_stream-xp-x86.exe
